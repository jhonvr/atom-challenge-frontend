<div class="login-wrapper">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
      <mat-card-subtitle>Ingresa tu correo para continuar</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Correo electrónico</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-icon matSuffix>mail</mat-icon>
          <mat-error *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">
            El correo es obligatorio
          </mat-error>
          <mat-error *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">
            Ingresa un correo válido
          </mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" class="full" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Validando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
